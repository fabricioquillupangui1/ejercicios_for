<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡La Divertida Tabla del 3!</title>
    <!-- Importamos una tipografía divertida y amigable desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="multiplicar.css">
</head>
<body>

    <header class="header">
        <button class="btn-probar">¡PROBAR!</button>
    </header>

    <main class="container">
        <section class="card">
            <h1>🎈 La Tabla del 3 🎈</h1>
            <ul class="multiplication-table">
                <li>3 × 1 = <span>3</span></li>
                <li>3 × 2 = <span>6</span></li>
                <li>3 × 3 = <span>9</span></li>
                <li>3 × 4 = <span>12</span></li>
                <li>3 × 5 = <span>15</span></li>
                <li>3 × 6 = <span>18</span></li>
                <li>3 × 7 = <span>21</span></li>
                <li>3 × 8 = <span>24</span></li>
                <li>3 × 9 = <span>27</span></li>
                <li>3 × 10 = <span>30</span></li>
                <li>3 × 11 = <span>33</span></li>
                <li>3 × 12 = <span>36</span></li>
            </ul>
        </section>
    </main>

    <footer class="footer">
        <p>Creado con ❤️ por: Tu amorcito</p>
        <div class="logo-container">
            <img src="logo.png" alt="Logo de creador" class="logo-img">
        </div>
    </footer>

</body>
</html>
