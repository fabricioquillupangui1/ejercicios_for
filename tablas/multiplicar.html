<!DOCTYPE html>
<html lang="es">
<head>

                <div class="fila">5 × 8 = <span></span></div>
                <div class="fila">5 × 9 = <span></span></div>
                <div class="fila">5 × 10 = <span></span></div>
                <div class="fila">5 × 11 = <span></span></div>
                <div class="fila">5 × 12 = <span></span></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>Creado con ❤️ por: Tu cariñito por siempre</p>
        <div class="logo-container">
            <img src="logo.png" alt="Logo de creador" class="logo-img">

<script src="multiplicar.js"></script>
